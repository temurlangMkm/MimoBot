
name: Build and deploy Mimo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mimo-production-deploy
  cancel-in-progress: false

jobs:
    build:
      services:
        postgres:
          image: postgres:18
          env:
            POSTGRES_DB: mimo_test
            POSTGRES_USER: mimo_test
            POSTGRES_PASSWORD: mimo_test
          ports:
            - 5432:5432
          options: >-
            --health-cmd "pg_isready -U mimo_test -d mimo_test"
            --health-interval 10s
            --health-timeout 5s
            --health-retries 5
      name: Build and test
      runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: mimo_test
          POSTGRES_USER: mimo_test
          POSTGRES_PASSWORD: mimo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mimo_test -d mimo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/mimo_test
          SPRING_DATASOURCE_USERNAME: mimo_test
          SPRING_DATASOURCE_PASSWORD: mimo_test
        run: mvn -B clean verify

      - name: Verify executable JAR
        run: |
          test -s target/mimo-0.0.1-SNAPSHOT.jar
          jar tf target/mimo-0.0.1-SNAPSHOT.jar | grep -q 'BOOT-INF/'

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: mimo-jar
          path: target/mimo-0.0.1-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to Hetzner
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: mimo-jar
          path: artifact

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy JAR to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          scp -i ~/.ssh/deploy_key \
            -P "$DEPLOY_PORT" \
            artifact/mimo-0.0.1-SNAPSHOT.jar \
            "$DEPLOY_USER@$DEPLOY_HOST:/opt/mimo/releases/mimo.jar"

      - name: Restart Mimo service
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'sudo /usr/local/sbin/deploy-mimo'
